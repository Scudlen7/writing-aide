name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install-lint-build:
    # Playwright 1.59.1 supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: writing_aide
          POSTGRES_PASSWORD: local-test
          POSTGRES_DB: writing_aide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U writing_aide -d writing_aide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Test writing flow with PostgreSQL
        env:
          DATABASE_URL: postgresql://writing_aide:local-test@localhost:5432/writing_aide_test
          TEST_DATABASE_URL: postgresql://writing_aide:local-test@localhost:5432/writing_aide_test
        run: |
          pnpm db:migrate
          node --test server/course-flow.integration.ts

      - name: Build the project
        run: pnpm build
